<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Trip Itinerary</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E7EEF1;
    --paper: #ffffff;
    --ink: #1C2B39;
    --muted: #64768A;
    --stamp: #C1443D;
    --stamp-dark: #A5372F;
    --airmail: #2F6690;
    --line: #D3DCE2;
    --stamp-light: #F7E6E4;
    --airmail-light: #E4EEF3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    background-image:
      repeating-linear-gradient(-45deg, rgba(47,102,144,0.05) 0 10px, transparent 10px 20px);
    background-attachment: fixed;
    color: var(--ink);
    padding: 28px 16px 90px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.9rem;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .sub { color: var(--muted); margin-bottom: 22px; font-size: 0.92rem; }
  .day-group { margin-bottom: 28px; }
  .day-title {
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 10px;
    color: var(--stamp);
  }

  /* --- item card: styled as a torn ticket stub --- */
  .item {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px 14px 68px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(28,43,57,0.04);
  }
  .item::before {
    /* dashed perforation separating the time stub from the main content */
    content: "";
    position: absolute;
    left: 56px;
    top: 10px;
    bottom: 10px;
    border-left: 1.5px dashed var(--line);
  }
  .item::after {
    /* punch-hole at the perforation, like a torn ticket edge */
    content: "";
    position: absolute;
    left: 51px;
    top: -1px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .item-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .item-time {
    position: absolute;
    left: 0;
    top: 14px;
    width: 56px;
    text-align: center;
    color: var(--stamp-dark);
    font-family: 'Fraunces', serif;
    font-size: 1.02rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .item-title-block { flex: 1; min-width: 0; }
  .item-title { font-weight: 600; font-size: 1.02rem; }
  .item-loc { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .item-notes { font-size: 0.9rem; margin-top: 8px; white-space: pre-wrap; color: var(--ink); opacity: 0.85; }
  .item-actions { margin-top: 12px; display: flex; gap: 14px; }
  .item-actions button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 2px 0;
    font-family: 'Inter', sans-serif;
  }
  .item-actions button:hover { color: var(--stamp); }
  .comments { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .comment { font-size: 0.85rem; margin-bottom: 6px; }
  .comment b { color: var(--airmail); font-weight: 600; }
  .comment-form { display: flex; gap: 6px; margin-top: 6px; }
  .comment-form input[type=text] {
    flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; font-size: 0.85rem; font-family: inherit;
  }
  .comment-form button, .add-btn, .save-btn {
    background: var(--stamp);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .comment-form button:hover, .add-btn:hover, .save-btn:hover { background: var(--stamp-dark); }
  .cancel-btn {
    background: none;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  /* --- add-item panel: a plain paper card, deliberately calmer than the tickets --- */
  .add-form {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-top: 22px;
  }
  .add-form h3 {
    margin: 0 0 12px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
  }
  .add-form input, .add-form textarea {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--ink);
  }
  .add-form input:focus, .add-form textarea:focus, .edit-field:focus {
    outline: none;
    border-color: var(--airmail);
    box-shadow: 0 0 0 3px var(--airmail-light);
  }
  button:focus-visible, a:focus-visible, .day-tab:focus-visible {
    outline: 2px solid var(--airmail);
    outline-offset: 2px;
  }
  .row2 { display: flex; gap: 8px; }
  .row2 input { flex: 1; }
  .edit-field {
    width: 100%; padding: 8px 10px; margin-bottom: 7px; border: 1px solid var(--line);
    border-radius: 7px; font-size: 0.9rem; font-family: inherit;
  }

  /* --- gate: the boarding-pass entry screen --- */
  .gate {
    max-width: 380px;
    margin: 60px auto;
    background: var(--paper);
    border-radius: 14px;
    padding: 30px 28px 26px;
    box-shadow: 0 4px 24px rgba(28,43,57,0.08);
    text-align: left;
  }
  .gate h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .gate p { color: var(--muted); font-size: 0.88rem; margin: 0 0 18px; }
  .gate label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .gate input {
    padding: 10px 12px; width: 100%; margin-bottom: 16px;
    border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem; font-family: inherit;
  }
  .gate input:focus { outline: none; border-color: var(--airmail); box-shadow: 0 0 0 3px var(--airmail-light); }
  .gate button {
    width: 100%;
    padding: 11px 16px;
    background: var(--stamp);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .gate button:hover { background: var(--stamp-dark); }

  .name-tag {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 18px; font-size: 0.85rem; color: var(--muted);
  }
  .name-tag b { color: var(--ink); }
  .name-tag a { color: var(--airmail); text-decoration: none; font-size: 0.8rem; }
  .name-tag a:hover { text-decoration: underline; }

  .empty { color: var(--muted); font-size: 0.9rem; padding: 24px 0; text-align: center; }
  .error { color: var(--stamp-dark); font-size: 0.85rem; margin-top: 8px; }

  /* --- day tabs: styled like small luggage tags --- */
  .day-tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 18px; padding: 6px 2px 10px; }
  .day-tab {
    position: relative;
    flex: 0 0 auto;
    padding: 8px 16px 8px 22px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .day-tab::before {
    /* luggage-tag punch hole */
    content: "";
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--muted);
  }
  .day-tab.active {
    background: var(--airmail);
    color: white;
    border-color: var(--airmail);
  }
  .day-tab.active::before { border-color: rgba(255,255,255,0.8); background: var(--airmail); }

  .trip-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--airmail);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .trip-card:hover { border-left-color: var(--stamp); }
  .trip-card .item-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; }

  /* --- photos --- */
  .photos { margin-top: 10px; }
  .photo-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .photo-thumb { position: relative; width: 76px; }
  .photo-thumb img {
    width: 76px; height: 76px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--line); cursor: pointer; display: block;
    background: var(--stamp-light);
  }
  .photo-del {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--stamp); color: white; border: none;
    font-size: 12px; line-height: 20px; text-align: center; padding: 0;
    cursor: pointer;
  }
  .photo-caption {
    font-size: 0.72rem; color: var(--muted); margin-top: 3px;
    text-align: center; cursor: pointer; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .photo-caption.muted { opacity: 0.6; font-style: italic; }
  .photo-add-btn {
    display: inline-block; margin-top: 8px; padding: 6px 12px;
    border: 1px dashed var(--line); border-radius: 8px;
    font-size: 0.8rem; color: var(--stamp); cursor: pointer;
  }
  .photo-add-btn:hover { background: var(--stamp-light); }
  .photo-status { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

  /* --- image lightbox --- */
  .photo-lightbox {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .photo-lightbox.show {
    display: flex;
  }
  
  .photo-lightbox img {
    max-width: 95vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  }
  
  .photo-lightbox-close {
    position: fixed;
    top: 18px;
    right: 22px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    font-size: 28px;
    line-height: 42px;
    text-align: center;
    cursor: pointer;
    z-index: 10000;
  }
  
  .photo-lightbox-close:hover {
    background: white;
  }

  .comment-text a {
    color: var(--airmail);
    text-decoration: underline;
    word-break: break-all;
  }
  
  .comment-text a:hover {
    opacity: 0.8;
  }

  .comment-actions {
    margin-left: 8px;
  }
  
  .comment-actions button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 0 3px;
  }
  
  .comment-actions button:hover {
    color: var(--stamp);
  }
</style>
</head>

<body>
<div id="photoLightbox" class="photo-lightbox" onclick="closePhotoLightbox(event)">
  <button class="photo-lightbox-close" onclick="closePhotoLightbox(event)">×</button>
  <img id="photoLightboxImg" src="" alt="Full size photo" />
</div>
<div id="gate" class="gate">
  <h2>Trip Itinerary</h2>
  <p>Enter your name and the shared password to continue.</p>
  <label for="nameInput">Your name</label>
  <input type="text" id="nameInput" placeholder="e.g. Alex" onkeydown="if(event.key==='Enter') document.getElementById('passInput').focus()" />
  <label for="passInput">Password</label>
  <input type="password" id="passInput" placeholder="Shared password" onkeydown="if(event.key==='Enter') checkPassword()" />
  <button onclick="checkPassword()">Continue</button>
  <div id="gateError" class="error"></div>
</div>

<div class="wrap" id="tripPicker" style="display:none;">
  <h1>Select a trip</h1>
  <div class="sub">Pick an existing trip, or create a new one.</div>
  <div id="tripList" class="add-form"></div>
  <div class="add-form">
    <h3>Create new trip</h3>
    <input type="text" id="newTripName" placeholder="Trip name (e.g. Japan 2026)" />
    <input type="text" id="newTripSlug" placeholder="URL slug (e.g. japan-2026)" />
    <button class="add-btn" onclick="createTrip()">Create trip</button>
    <div id="tripError" class="error"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <div class="sub"><a href="#" onclick="backToPicker(); return false;">&larr; switch trip</a></div>
  <h1 id="tripName">Loading trip…</h1>
  <div class="sub" id="tripSub"></div>

  <div class="name-tag">
    Editing as <b id="currentNameDisplay"></b>
    <a href="#" onclick="changeName(); return false;">· not you?</a>
  </div>

  <div id="dayTabs" class="day-tabs"></div>
  <div id="days"></div>

  <div class="add-form">
    <h3>Add itinerary item</h3>
    <div class="row2">
      <input type="number" id="newDay" placeholder="Day #" min="1" />
      <input type="time" id="newTime" placeholder="Time" />
    </div>
    <input type="text" id="newTitle" placeholder="Title (e.g. Fushimi Inari hike)" />
    <input type="text" id="newLocation" placeholder="Location (optional)" />
    <textarea id="newNotes" placeholder="Notes (optional)" rows="2"></textarea>
    <button class="add-btn" onclick="addItem()">Add item</button>
    <div id="addError" class="error"></div>
  </div>
</div>

<script>
  // ---- CONFIG: fill these in ----
  const SUPABASE_URL = "https://cvksnemhjtcxgispoogw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_r9lHIqec7Qoze7Qh5pKSvA_TalHpu4z";
  const SHARED_PASSWORD = "0920"; // simple gate, not real security — change this to your own
  const PHOTOS_BUCKET = "itinerary-photos";
  // --------------------------------

  let supabaseClient;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    document.getElementById('gateError').textContent =
      'Failed to load Supabase library — check your internet connection or ad-blocker (console: ' + e.message + ')';
    console.error('Supabase init failed:', e);
  }
  let tripId = null;
  let items = [];

  function checkPassword() {
    const name = document.getElementById('nameInput').value.trim();
    const val = document.getElementById('passInput').value.trim();
    const errEl = document.getElementById('gateError');

    if (!name) { errEl.textContent = 'Please enter your name.'; return; }
    if (val !== SHARED_PASSWORD) { errEl.textContent = 'Wrong password.'; return; }

    localStorage.setItem('trip_username', name);
    sessionStorage.setItem('trip_auth', 'ok');
    document.getElementById('gate').style.display = 'none';
    enterAfterAuth();
  }

  if (sessionStorage.getItem('trip_auth') === 'ok' && localStorage.getItem('trip_username')) {
    document.getElementById('gate').style.display = 'none';
    enterAfterAuth();
  }

  function enterAfterAuth() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('trip');
    if (slug) {
      openTrip(slug);
    } else {
      showTripPicker();
    }
  }

  function backToPicker() {
    const url = new URL(window.location);
    url.searchParams.delete('trip');
    window.history.pushState({}, '', url);
    document.getElementById('app').style.display = 'none';
    showTripPicker();
  }

  async function showTripPicker() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('tripPicker').style.display = 'block';

    const { data: trips, error } = await supabaseClient
      .from('trips')
      .select('*')
      .eq('is_deleted', false)
      .order('created_at', { ascending: false });

    const listEl = document.getElementById('tripList');
    if (error) {
      listEl.innerHTML = '<div class="error">Could not load trips: ' + escapeHtml(error.message) + '</div>';
      console.error('Trip list error:', error);
      return;
    }
    if (!trips || trips.length === 0) {
      listEl.innerHTML = '<div class="empty">No trips yet — create one below.</div>';
      return;
    }
    listEl.innerHTML = '<h3>Existing trips</h3>' + trips.map(t =>
      `<div class="trip-card" onclick="selectTrip('${t.slug}')">
         <div class="item-title">${escapeHtml(t.name)}</div>
         <div class="item-loc">/?trip=${escapeHtml(t.slug)}</div>
       </div>`
    ).join('');
  }

  function selectTrip(slug) {
    const url = new URL(window.location);
    url.searchParams.set('trip', slug);
    window.history.pushState({}, '', url);
    openTrip(slug);
  }

  async function createTrip() {
    const name = document.getElementById('newTripName').value.trim();
    let slug = document.getElementById('newTripSlug').value.trim();
    const errEl = document.getElementById('tripError');
    errEl.textContent = '';

    if (!name) { errEl.textContent = 'Trip name is required.'; return; }
    if (!slug) {
      slug = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    const { error } = await supabaseClient.from('trips').insert({ name, slug });
    if (error) {
      errEl.textContent = error.message.includes('duplicate') ? 'That slug is already taken.' : error.message;
      return;
    }
    selectTrip(slug);
  }

  async function openTrip(slug) {
    document.getElementById('tripPicker').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    const nameDisplay = document.getElementById('currentNameDisplay');
    if (nameDisplay) nameDisplay.textContent = getName();
    await init(slug);
  }

  function getName() {
    return localStorage.getItem('trip_username') || 'Someone';
  }

  function changeName() {
    localStorage.removeItem('trip_username');
    sessionStorage.removeItem('trip_auth');
    location.reload();
  }

  async function init(slug) {
    const { data: trip, error } = await supabaseClient
      .from('trips')
      .select('*')
      .eq('slug', slug)
      .eq('is_deleted', false)
      .single();

    if (error || !trip) {
      document.getElementById('tripName').textContent = 'Trip not found';
      return;
    }
    tripId = trip.id;
    document.getElementById('tripName').textContent = trip.name;
    document.getElementById('tripSub').textContent = 'Edit the plan, leave comments below each item.';

    await loadItems();

    supabaseClient
      .channel('itinerary-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'itinerary_items' }, loadItems)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, loadItems)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'itinerary_photos' }, loadItems)
      .subscribe();
  }

  function getPhotoUrl(path) {
    const { data } = supabaseClient.storage.from(PHOTOS_BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }

  async function loadItems() {
    const { data: itemRows } = await supabaseClient
      .from('itinerary_items')
      .select('*')
      .eq('trip_id', tripId)
      .eq('is_deleted', false)
      .order('day_number', { ascending: true })
      .order('time', { ascending: true, nullsFirst: false })
      .order('id', { ascending: true });

    const { data: commentRows } = await supabaseClient
      .from('comments')
      .select('*')
      .eq('is_deleted', false)
      .order('created_at', { ascending: true });

    const { data: photoRows } = await supabaseClient
      .from('itinerary_photos')
      .select('*')
      .eq('is_deleted', false)
      .order('created_at', { ascending: true });

    items = (itemRows || []).map(it => ({
      ...it,
      comments: (commentRows || []).filter(c => c.item_id === it.id),
      photos: (photoRows || [])
        .filter(p => p.item_id === it.id)
        .map(p => ({ ...p, url: getPhotoUrl(p.storage_path) }))
    }));

    render();
  }

  let currentDay = null;

  function render() {
    const tabsEl = document.getElementById('dayTabs');
    const container = document.getElementById('days');
    tabsEl.innerHTML = '';
    container.innerHTML = '';

    if (items.length === 0) {
      container.innerHTML = '<div class="empty">No itinerary items yet. Add the first one below!</div>';
      return;
    }

    const grouped = {};
    items.forEach(it => {
      const d = it.day_number ?? 'Unscheduled';
      if (!grouped[d]) grouped[d] = [];
      grouped[d].push(it);
    });

    const dayKeys = Object.keys(grouped).sort((a, b) =>
      a === 'Unscheduled' ? 1 : b === 'Unscheduled' ? -1 : a - b
    );

    // if the previously selected day no longer exists (e.g. its last item was deleted), fall back to the first day
    if (currentDay === null || !dayKeys.includes(String(currentDay))) {
      currentDay = dayKeys[0];
    }

    dayKeys.forEach(day => {
      const tab = document.createElement('button');
      tab.className = 'day-tab' + (day === currentDay ? ' active' : '');
      tab.textContent = day === 'Unscheduled' ? 'Unscheduled' : `Day ${day}`;
      tab.onclick = () => { currentDay = day; render(); };
      tabsEl.appendChild(tab);
    });

    grouped[currentDay].forEach(it => container.appendChild(renderItem(it)));

    const newDayInput = document.getElementById('newDay');
    if (newDayInput && currentDay !== 'Unscheduled') newDayInput.value = currentDay;
  }

  function renderItem(it) {
    const div = document.createElement('div');
    div.className = 'item';
    div.id = `item-${it.id}`;
    const photos = it.photos || [];
    div.innerHTML = `
      <div class="item-top">
        <div class="item-time">${it.time ? escapeHtml(it.time.slice(0,5)) : ''}</div>
        <div class="item-title-block">
          <div class="item-title">${escapeHtml(it.title)}</div>
        </div>
      </div>
      ${it.location ? `<div class="item-loc">📍 ${escapeHtml(it.location)}</div>` : ''}
      ${it.notes ? `<div class="item-notes">${escapeHtml(it.notes)}</div>` : ''}
      <div class="photos" id="photos-${it.id}">
        <div class="photo-grid">
          ${photos.map(p => `
            <div class="photo-thumb">
              <img src="${escapeAttr(p.url)}" onclick="openPhotoLightbox('${escapeAttr(p.url)}')" />
              <button class="photo-del" title="Delete photo" onclick="deletePhoto('${p.id}', '${escapeAttr(p.storage_path)}')">×</button>
              ${p.caption
                ? `<div class="photo-caption" title="Click to edit caption" onclick="editCaption('${p.id}')">${escapeHtml(p.caption)}</div>`
                : `<div class="photo-caption muted" title="Click to add caption" onclick="editCaption('${p.id}')">+ caption</div>`}
            </div>
          `).join('')}
        </div>
        <label class="photo-add-btn">
          📷 Add photo${photos.length ? 's' : ''}
          <input type="file" accept="image/*" multiple style="display:none" onchange="uploadPhotos('${it.id}', this.files); this.value='';" />
        </label>
        <div class="photo-status" id="photo-status-${it.id}"></div>
      </div>
      <div class="item-actions">
        <button onclick="startEdit('${it.id}')">Edit</button>
        <button onclick="deleteItem('${it.id}')">Delete</button>
      </div>
      <div class="comments" id="comments-${it.id}">
        ${it.comments.map(c => {
            const canEdit = getName() === (c.author || 'Someone');
          
            return `
              <div class="comment" id="comment-${c.id}">
                <b>${escapeHtml(c.author || 'Someone')}:</b>
                <span class="comment-text">${linkifyText(c.text)}</span>
                ${canEdit ? `
                  <span class="comment-actions">
                    <button onclick="editComment('${c.id}')">Edit</button>
                    <button onclick="deleteComment('${c.id}')">Delete</button>
                  </span>
                ` : ''}
              </div>
            `;
          }).join('')}
        <div class="comment-form">
          <input type="text" id="commentInput-${it.id}" placeholder="Add a comment…" />
          <button onclick="addComment('${it.id}')">Post</button>
        </div>
      </div>
    `;
    return div;
  }

  async function uploadPhotos(itemId, fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const statusEl = document.getElementById(`photo-status-${itemId}`);
    if (statusEl) statusEl.textContent = `Uploading ${files.length} photo${files.length > 1 ? 's' : ''}…`;

    for (const file of files) {
      const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';
      const path = `${tripId}/${itemId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

      const { error: upErr } = await supabaseClient.storage.from(PHOTOS_BUCKET).upload(path, file, {
        cacheControl: '3600',
        upsert: false
      });
      if (upErr) {
        if (statusEl) statusEl.textContent = 'Upload failed: ' + upErr.message;
        console.error('Photo upload error:', upErr);
        continue;
      }

      const { error: insErr } = await supabaseClient.from('itinerary_photos').insert({
        item_id: itemId,
        storage_path: path,
        uploaded_by: getName()
      });
      if (insErr) console.error('Photo record insert error:', insErr);
    }

    if (statusEl) statusEl.textContent = '';
    await loadItems();
  }

  async function deletePhoto(photoId, storagePath) {
    if (!confirm('Delete this photo?')) return;
    await supabaseClient.storage.from(PHOTOS_BUCKET).remove([storagePath]);
    await supabaseClient.from('itinerary_photos').update({ is_deleted: true }).eq('id', photoId);
    await loadItems();
  }

  async function editCaption(photoId) {
    const photo = items.flatMap(i => i.photos || []).find(p => p.id === photoId);
    const current = photo ? (photo.caption || '') : '';
    const next = prompt('Caption:', current);
    if (next === null) return; // cancelled
    await supabaseClient.from('itinerary_photos').update({ caption: next.trim() || null }).eq('id', photoId);
    await loadItems();
  }

  function startEdit(id) {
    const it = items.find(i => i.id === id);
    const div = document.getElementById(`item-${id}`);
    div.innerHTML = `
      <input class="edit-field" id="edit-title-${id}" value="${escapeAttr(it.title)}" placeholder="Title" />
      <div class="row2">
        <input class="edit-field" id="edit-day-${id}" type="number" value="${it.day_number ?? ''}" placeholder="Day #" />
        <input class="edit-field" id="edit-time-${id}" type="time" value="${escapeAttr(it.time || '')}" placeholder="Time" />
      </div>
      <input class="edit-field" id="edit-location-${id}" value="${escapeAttr(it.location || '')}" placeholder="Location" />
      <textarea class="edit-field" id="edit-notes-${id}" rows="2" placeholder="Notes">${escapeHtml(it.notes || '')}</textarea>
      <button class="save-btn" onclick="saveEdit('${id}')">Save</button>
      <button class="cancel-btn" onclick="render()">Cancel</button>
    `;
  }

  async function saveEdit(id) {
    const title = document.getElementById(`edit-title-${id}`).value.trim();
    if (!title) return alert('Title is required');
    const day = document.getElementById(`edit-day-${id}`).value;
    const time = document.getElementById(`edit-time-${id}`).value.trim();
    const location = document.getElementById(`edit-location-${id}`).value.trim();
    const notes = document.getElementById(`edit-notes-${id}`).value.trim();

    await supabaseClient.from('itinerary_items').update({
      title, day_number: day ? parseInt(day) : null, time, location, notes,
      updated_at: new Date().toISOString()
    }).eq('id', id);

    await loadItems();
  }

  async function deleteItem(id) {
    if (!confirm('Delete this item?')) return;
    await supabaseClient.from('itinerary_items').update({ is_deleted: true }).eq('id', id);
    await loadItems();
  }

  async function addItem() {
    const title = document.getElementById('newTitle').value.trim();
    const errEl = document.getElementById('addError');
    if (!title) { errEl.textContent = 'Title is required.'; return; }
    errEl.textContent = '';

    const day = document.getElementById('newDay').value;
    const time = document.getElementById('newTime').value.trim();
    const location = document.getElementById('newLocation').value.trim();
    const notes = document.getElementById('newNotes').value.trim();

    const { error } = await supabaseClient.from('itinerary_items').insert({
      trip_id: tripId,
      title, time, location, notes,
      day_number: day ? parseInt(day) : null,
      created_by: getName()
    });

    if (error) { errEl.textContent = error.message; return; }

    document.getElementById('newDay').value = '';
    document.getElementById('newTime').value = '';
    document.getElementById('newTitle').value = '';
    document.getElementById('newLocation').value = '';
    document.getElementById('newNotes').value = '';

    await loadItems();
  }

  async function addComment(itemId) {
    const input = document.getElementById(`commentInput-${itemId}`);
    const text = input.value.trim();
    if (!text) return;
    await supabaseClient.from('comments').insert({
      item_id: itemId,
      author: getName(),
      text
    });
    await loadItems();
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }
  function linkifyText(str) {
    if (!str) return '';
  
    const escaped = escapeHtml(str);
  
    return escaped.replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );
  }

  async function editComment(commentId) {
  const comment = items
    .flatMap(i => i.comments || [])
    .find(c => c.id === commentId);

  if (!comment) return;

  // Make sure the current user is the original author
  if (getName() !== (comment.author || 'Someone')) {
    alert('You can only edit your own comments.');
    return;
  }

  const next = prompt('Edit comment:', comment.text);

  if (next === null) return;

  const text = next.trim();

  if (!text) {
    alert('Comment cannot be empty.');
    return;
  }

  const { error } = await supabaseClient
    .from('comments')
    .update({ text })
    .eq('id', commentId)
    .eq('author', getName());

  if (error) {
    alert('Failed to edit comment: ' + error.message);
    return;
  }

  await loadItems();
}

async function deleteComment(commentId) {
  const comment = items
    .flatMap(i => i.comments || [])
    .find(c => c.id === commentId);

  if (!comment) return;

  // Make sure the current user is the original author
  if (getName() !== (comment.author || 'Someone')) {
    alert('You can only delete your own comments.');
    return;
  }

  if (!confirm('Delete this comment?')) return;

  const { error } = await supabaseClient
    .from('comments')
    .update({ is_deleted: true })
    .eq('id', commentId)
    .eq('author', getName());

  if (error) {
    alert('Failed to delete comment: ' + error.message);
    return;
  }

  await loadItems();
}
  
  function escapeAttr(str) { return escapeHtml(str); }
  
  function openPhotoLightbox(url) {
    const lightbox = document.getElementById('photoLightbox');
    const img = document.getElementById('photoLightboxImg');
  
    img.src = url;
    lightbox.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  
  function closePhotoLightbox(event) {
    // If clicking the image itself, don't close
    if (event && event.target.id === 'photoLightboxImg') return;
  
    const lightbox = document.getElementById('photoLightbox');
    const img = document.getElementById('photoLightboxImg');
  
    lightbox.classList.remove('show');
    img.src = '';
    document.body.style.overflow = '';
  }
  
  // Allow ESC key to close
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closePhotoLightbox();
    }
  });
</script>
